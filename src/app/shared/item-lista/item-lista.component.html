<div
    class="border border-indigo-100 rounded-md px-4 pr-0"
    [class.py-2]="!!descricao"
    [style.backgroundColor]="cor"
>
    <div class="flex items-center justify-between">
        <div>
            <h5 class="font-semibold text-[13px]">{{ titulo }}</h5>
            @if (!!descricao) {
                <p class="text-xs whitespace-pre-line line-clamp-2">
                    {{ descricao }}
                </p>
            }
        </div>
        <div class="flex">
            <button
                class="group cursor-pointer flex w-8 h-10 items-center justify-center"
                (click)="editar()"
            >
                <i
                    class="fa-solid fa-pencil text-indigo-500 group-hover:text-indigo-700 transition-all duration-300 ease-in-out"
                ></i>
            </button>
            <button
                class="group cursor-pointer flex w-10 h-10 items-center justify-center"
                (click)="excluir()"
            >
                <i
                    class="fa-solid fa-trash-can text-indigo-500 group-hover:text-indigo-700 transition-all duration-300 ease-in-out"
                ></i>
            </button>
        </div>
    </div>
</div>
