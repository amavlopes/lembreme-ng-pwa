<p-dialog
    [id]="id"
    [modal]="true"
    [(visible)]="mostrarDialog"
    (onHide)="fechar()"
    [style]="{ width: largura }"
>
    <ng-template #header>
        <h4 class="font-semibold text-base">{{ titulo }}</h4>
    </ng-template>

    <div class="pt-1.5 whitespace-pre-line">
        <ng-content></ng-content>
    </div>
</p-dialog>
